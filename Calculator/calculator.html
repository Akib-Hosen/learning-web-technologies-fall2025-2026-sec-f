<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        h1{
            text-align: center;
        }
        #calculator{
            width: 252px;
            padding: 20px;
            background: #f2f2f2;
            border-radius: 10px;
        }

        #input_dis{
            width: 100%;
            height: 40px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
        }

        .buttons button{
            width: 50px;
            height: 50px;
            font-size: 20px;
            margin: 5px;
        }
    </style>
</head>
<body>
    
    <div id="calculator">
        <h1>Calculator</h1>
        <input type="text" id="input_dis" disabled>

        <div class="buttons">
            <button onclick="addDigit('7')">7</button>
            <button onclick="addDigit('8')">8</button>
            <button onclick="addDigit('9')">9</button>
            <button onclick="setOperator('/')">/</button>

            <button onclick="addDigit('4')">4</button>
            <button onclick="addDigit('5')">5</button>
            <button onclick="addDigit('6')">6</button>
            <button onclick="setOperator('*')">*</button>

            <button onclick="addDigit('1')">1</button>
            <button onclick="addDigit('2')">2</button>
            <button onclick="addDigit('3')">3</button>
            <button onclick="setOperator('-')">-</button>

            <button onclick="addDigit('0')">0</button>
            <button onclick="addDot()">.</button>
            <button onclick="finalEqual()">=</button>
            <button onclick="setOperator('+')">+</button>
            <button onclick="resetAll()">C</button>
            <button onclick="deleteLast()">Del</button>
        </div>
    </div>

    <script>
        let firstValue = "";
        let nextValue = "";
        let sign = "";
        let screen = "";

        function showScreen() {
            document.getElementById("input_dis").value = screen;
        }

        function addDigit(n) {
            nextValue += n;
            screen += n;
            showScreen();
        }

        function addDot() {
            if (nextValue.indexOf('.') !== -1) return;
            if (nextValue === "") {
                nextValue = "0.";
                screen += "0.";
            } else {
                nextValue += ".";
                screen += ".";
            }
            showScreen();
        }

        function setOperator(op) {
            if (nextValue === "" && firstValue === "") return;

            if (nextValue === "" && screen !== "") {
                screen = screen.slice(0, screen.length - 1) + op;
                sign = op;
                showScreen();
                return;
            }

            if (firstValue === "") {
                firstValue = nextValue;
            } else {
                firstValue = getResult(firstValue, nextValue, sign);
            }

            sign = op;
            nextValue = "";
            screen = firstValue + op;
            showScreen();
        }

        function getResult(num1, num2, operator) {
            let number1 = parseFloat(num1);
            let number2 = parseFloat(num2);
            let result = 0;

            if (operator === "+") {
                result = number1 + number2;
            } 
            else if (operator === "-") {
                result = number1 - number2;
            } 
            else if (operator === "*") {
                result = number1 * number2;
            } 
            else if (operator === "/") {
                if (number2 === 0) return "Error";
                result = number1 / number2;
            }

            return result.toString();
        }


        function finalEqual() {
            if (firstValue === "" || nextValue === "" || sign === "") return;

            let out = getResult(firstValue, nextValue, sign);
            screen = out;
            showScreen();

            firstValue = "";
            nextValue = out;
            sign = "";
        }

        function resetAll() {
            firstValue = "";
            nextValue = "";
            sign = "";
            screen = "";
            showScreen();
        }

        function deleteLast() {
            if (screen.length === 0) return;

            let last = screen.slice(-1);

            if (!isNaN(last) || last === ".") {
                nextValue = nextValue.slice(0, nextValue.length - 1);
            } 
            else if (["+", "-", "*", "/"].includes(last)) {
                sign = "";
            }

            screen = screen.slice(0, screen.length - 1);
            showScreen();
        }
    </script>
</body>
</html>
