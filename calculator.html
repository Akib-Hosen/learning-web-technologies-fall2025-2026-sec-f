<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        #calculator{
            width: 300px;
            padding: 20px;
            background: #f2f2f2;
            border-radius: 10px;
        }

        #input_dis{
            width: 100%;
            height: 40px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
        }
        .buttons{
            width: 50px;
            height: 50px;
            font-size: 20px;
            margin: 5px;
        }

    </style>
</head>
<body>
    
    <div id="calculator">
        <input type="text" id="input_dis" disabled>

        <div class="buttons">
            <button onclick="">9</button>
            <button onclick="">8</button>
            <button onclick="">7</button>
            <button onclick="">/</button>
            <br>
            <button onclick="">6</button>
            <button onclick="">5</button>
            <button onclick="">4</button>
            <button onclick="">*</button>
            <br>
            <button onclick="">3</button>
            <button onclick="">2</button>
            <button onclick="">1</button>
            <button onclick="">-</button>
            <br>
            <button onclick="">0</button>
            <button onclick="">C</button>
            <button onclick="">=</button>
            <button onclick="">+</button>
        </div>
    </div>

    <script>

    </script>
</body>
</html>
