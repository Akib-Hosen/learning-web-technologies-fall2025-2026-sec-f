<!DOCTYPE html>
<html>
<head>
    <title>Name</title>
</head>
<body>
    <form action="form1.html" method="post" id="nameForm" onsubmit="return test()">
        Name
        <br>
        <input type="text" id="name" name="name" value="" onblur="testName()">
        <p id="nameError"></p>
        <input type="submit" value="Submit">
    </form>

    <script>
        let nameError = document.getElementById('nameError');

        function isLetter(ch) {
            return (ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z');
        }

        function testName() {
            let name = document.getElementById('name').value;
            name = name.trim();

            if (name === "") {
                nameError.innerHTML = "Name cannot be empty.";
                nameError.style.color = "red";
                return;
            }

            let parts = name.split(" ");
            let words = [];
            for (let i = 0; i < parts.length; i++) {
                if (parts[i] !== "") {
                    words.push(parts[i]);
                }
            }
            if (words.length < 2) {
                nameError.innerHTML = "Name must contain at least two words.";
                nameError.style.color = "red";
                return;
            }

            if (!isLetter(name[0])) {
                nameError.innerHTML = "Name must start with a letter.";
                nameError.style.color = "red";
                return;
            }

            for (let i = 0; i < name.length; i++) {
                let ch = name[i];
                let ok = isLetter(ch) || ch === '.' || ch === '-' || ch === ' ';
                if (!ok) {
                    nameError.innerHTML = "Name can contain only a-z or A-Z or dot(.) or dash(-))";
                    nameError.style.color = "red";
                    return;
                }
            }
            nameError.innerHTML = "";
        }

        function test() {
            testName();
            return nameError.innerHTML === "";
        }
    </script>
</body>
</html>
