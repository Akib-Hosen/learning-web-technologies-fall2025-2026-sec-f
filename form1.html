<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
</head>
<body>
    <form action="form2.html" method="post" id="emailForm" onsubmit="return test()">
        Email:
        <input type="text" id="email" name="email" value="" onblur="testEmail()">
        <p id="emailError"></p>

        <input type="submit" value="Submit">
    </form>

    <script>
        let emailError = document.getElementById('emailError');

        function testEmail() {
            let email = document.getElementById('email').value;
            email = email.trim();

            if (email === "") {
                emailError.innerHTML = "Email cannot be empty.";
                emailError.style.color = "red";
                return;
            }

            let atPos = email.indexOf("@");
            let dotPos = -1;

            if (atPos === -1) {
                emailError.innerHTML = "Email must contain '@'.";
                emailError.style.color = "red";
                return;
            }

            for (let i = atPos + 1; i < email.length; i++) {
                if (email[i] === ".") {
                    dotPos = i;
                    break;
                }
            }

            if (dotPos === -1) {
                emailError.innerHTML = "Email must contain a '.' after '@'.";
            } else if (atPos === 0 || dotPos === atPos + 1 || dotPos === email.length - 1) {
                emailError.innerHTML = "Invalid email format. Use anything@example.com.";
            } else {
                emailError.innerHTML = "";
            }

            if (emailError.innerHTML !== "") {
                emailError.style.color = "red";
            }
        }

        function test() {
            testEmail();
            return emailError.innerHTML === "";
        }
    </script>
</body>
</html>
