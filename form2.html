<!DOCTYPE html>
<html>
<head>
    <title>Gender</title>
</head>
<body>
    <form action="form3.html" method="post" id="genderForm" onsubmit="return test()">
        <fieldset style="width: 200px;">
            <legend>Gender</legend>

            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
        </fieldset>
        <p id="genderError"></p>

        <input type="submit" value="Submit">
    </form>

    <script>
        let genderError = document.getElementById('genderError');

        function testGender() {
            let selected = document.querySelector('input[name="gender"]:checked');
            if (selected == null) {
                genderError.innerHTML = "At least one option has to be selected.";
                genderError.style.color = "red";
            } else {
                genderError.innerHTML = "";
            }
        }

        function test() {
            testGender();
            return genderError.innerHTML === "";
        }
    </script>
</body>
</html>
